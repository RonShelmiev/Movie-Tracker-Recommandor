<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flick — film tracker</title>
    <meta name="description" content="Log the films you have seen, keep a list of what is next, and get recommendations that explain themselves." />
    <meta name="theme-color" content="#04060a" />
    <meta property="og:title" content="Flick" />
    <meta property="og:description" content="A personal film tracker and recommender." />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304060A'/%3E%3Crect x='6' y='9' width='20' height='14' fill='none' stroke='%234EE2F2' stroke-width='2'/%3E%3Cpath d='M6 14h20M6 18h20M12 9v14M20 9v14' stroke='%234EE2F2' stroke-width='1.5' opacity='.55'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root">
      <div id="boot" style="
        min-height:100vh;display:grid;place-items:center;
        font:300 14px 'Chakra Petch',system-ui,sans-serif;color:#4a5c68;letter-spacing:.18em">
        LOADING FLICK
      </div>
    </div>

    <!--
      Assets are content-hashed and old builds are deleted on deploy, so a
      cached index.html can point at a script that no longer exists — which
      shows as a blank page. If nothing has rendered after 10s, reload once
      past the cache. sessionStorage stops it looping.
    -->
    <script>
      (function () {
        var FLAG = 'flick.recovered';
        function stillBlank() {
          var boot = document.getElementById('boot');
          return boot !== null;
        }
        setTimeout(function () {
          if (!stillBlank()) {
            // Confirmed good boot — only now is it safe to re-arm recovery.
            try { sessionStorage.removeItem(FLAG); } catch (e) {}
            return;
          }
          var tried;
          try { tried = sessionStorage.getItem(FLAG); } catch (e) { tried = '1'; }
          if (!tried) {
            try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
            var u = location.pathname + '?v=' + Date.now() + location.hash;
            location.replace(u);
            return;
          }
          var boot = document.getElementById('boot');
          if (boot) {
            boot.innerHTML =
              '<div style="max-width:320px;text-align:center;line-height:1.7">' +
              'FLICK COULD NOT START.<br><br>' +
              'Close the tab and reopen it, or clear this site\'s data.<br><br>' +
              'Your logged films are safe — they are stored separately.' +
              '</div>';
          }
        }, 10000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
