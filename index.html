<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flick — film tracker</title>
    <meta name="description" content="Log the films you have seen, keep a list of what is next, and get recommendations that explain themselves." />
    <meta name="theme-color" content="#04060a" />
    <meta property="og:title" content="Flick" />
    <meta property="og:description" content="A personal film tracker and recommender." />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304060A'/%3E%3Crect x='6' y='9' width='20' height='14' fill='none' stroke='%234EE2F2' stroke-width='2'/%3E%3Cpath d='M6 14h20M6 18h20M12 9v14M20 9v14' stroke='%234EE2F2' stroke-width='1.5' opacity='.55'/%3E%3C/svg%3E"
    />
    <!-- Installed-app behaviour. The paths are absolute for the same reason
         Vite's base is: a URL that loses its trailing slash resolves a
         relative path against the domain root and 404s. -->
    <link rel="manifest" href="/Movie-Tracker-Recommandor/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/Movie-Tracker-Recommandor/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flick" />
    <!-- "black" rather than "black-translucent": translucent puts the page
         under the clock and the top bar would need its own inset. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root">
      <div id="boot" style="
        min-height:100vh;display:grid;place-items:center;
        font:300 14px 'Chakra Petch',system-ui,sans-serif;color:#4a5c68;letter-spacing:.18em">
        LOADING FLICK
      </div>
    </div>

    <!--
      Assets are content-hashed and old builds are deleted on deploy, so a
      cached index.html can point at a script that no longer exists — which
      shows as a blank page. If nothing has rendered after 10s, reload once
      past the cache. sessionStorage stops it looping.
    -->
    <script>
      (function () {
        var FLAG = 'flick.recovered';
        function stillBlank() {
          var boot = document.getElementById('boot');
          return boot !== null;
        }
        setTimeout(function () {
          if (!stillBlank()) {
            // Confirmed good boot — only now is it safe to re-arm recovery.
            try { sessionStorage.removeItem(FLAG); } catch (e) {}
            return;
          }
          var tried;
          try { tried = sessionStorage.getItem(FLAG); } catch (e) { tried = '1'; }
          if (!tried) {
            try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
            // Keep the trailing slash: without it, relative URLs resolve
            // against the domain root and everything 404s.
            var path = location.pathname;
            if (path.charAt(path.length - 1) !== '/') path += '/';
            var url = path + '?v=' + Date.now() + location.hash;
            // A service worker serving a broken page would otherwise keep
            // serving it through the reload. Clear it out first, then retry.
            try {
              if (navigator.serviceWorker) {
                navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(rs.map(function (r) { return r.unregister(); }));
                }).then(function () {
                  return window.caches ? caches.keys().then(function (ks) {
                    return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                  }) : null;
                }).catch(function () {}).then(function () { location.replace(url); });
                return;
              }
            } catch (e) {}
            location.replace(url);
            return;
          }
          // Second failure: stop guessing and report what actually happened.
          // A screenshot of this is a diagnosis.
          var boot = document.getElementById('boot');
          if (!boot) return;
          var script = document.querySelector('script[type="module"]');
          var link = document.querySelector('link[rel="stylesheet"][href*="assets"]');
          var cssOn = false;
          try {
            cssOn = getComputedStyle(document.body).backgroundColor === 'rgb(4, 6, 10)';
          } catch (e) {}

          function line(k, v) {
            return '<div style="margin-top:6px"><b style="color:#7c919e">' + k + '</b> ' + v + '</div>';
          }
          function render(status) {
            boot.innerHTML =
              '<div style="max-width:340px;padding:24px;text-align:left;line-height:1.7;font-size:12px;' +
              'font-family:ui-monospace,monospace;word-break:break-all">' +
              '<div style="font-size:14px;letter-spacing:.14em;margin-bottom:14px">FLICK COULD NOT START</div>' +
              line('page', location.href) +
              line('script', script ? script.src : 'MISSING FROM HTML') +
              line('script http', status) +
              line('stylesheet', link ? link.href : 'MISSING FROM HTML') +
              line('css applied', cssOn ? 'yes' : 'no') +
              '<div style="margin-top:16px;color:#7c919e">Send this screen to Claude.</div>' +
              '<div style="margin-top:10px;color:#7c919e">Your logged films are stored separately and are safe.</div>' +
              '</div>';
          }

          render('checking…');
          if (script && window.fetch) {
            fetch(script.src, { cache: 'no-store' })
              .then(function (r) { render(r.status + ' ' + r.statusText); })
              .catch(function (e) { render('request failed — ' + (e && e.message ? e.message : 'blocked')); });
          } else {
            render('cannot check');
          }
        }, 10000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
